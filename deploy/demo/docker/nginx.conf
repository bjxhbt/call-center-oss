map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /healthz { default_type text/plain; return 200 'frontend ready\n'; }
    location ^~ /object-storage/ {
        limit_except GET { deny all; }
        proxy_pass http://rustfs:9000/;
        proxy_set_header Host rustfs:9000;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment always;
        add_header Cache-Control private,no-store always;
    }
    location ~ ^/(auth|call|system|captcha|v1|fs|customer|knowledge|intent|storage|asr|tts|ws|v3|swagger-ui)(/|$) {
        proxy_pass http://api:14320;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location = /index.html { add_header Cache-Control 'no-store'; }
    location / { try_files $uri $uri/ /index.html; }
}
