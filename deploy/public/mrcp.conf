mrcp {
    server {
        ip = "127.0.0.1"
        port = 1544
        advertise-ip = "127.0.0.1"
        session {
            timeout = 300s
            max-message-size = "1MB"
        }
    }
    codecs = [
        { name = "PCMU", rate = 8000, payload-type = 0 },
        { name = "PCMA", rate = 8000, payload-type = 8 }
    ]
    platform {
        name = "local"
        auth-key = ""
    }
    rtp.port-range { min = 10000, max = 20000 }
}
